name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0). Created on this commit if it does not exist."
        required: true

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --release
      - name: Build release exe
        run: cargo build --release
      - name: Rename artifact
        shell: pwsh
        run: Copy-Item target/release/blf_decoder.exe "blf_decoder-$env:RELEASE_TAG-windows-x64.exe"
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: BLF Decoder ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: |
            blf_decoder-${{ env.RELEASE_TAG }}-windows-x64.exe

  linux:
    runs-on: ubuntu-latest
    needs: windows
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release
      - name: Rename artifact
        run: cp target/release/blf_decoder "blf_decoder-${RELEASE_TAG}-linux-x64"
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          files: |
            blf_decoder-${{ env.RELEASE_TAG }}-linux-x64
