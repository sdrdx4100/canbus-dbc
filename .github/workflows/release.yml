name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --release
      - name: Build release exe
        run: cargo build --release
      - name: Rename artifact
        shell: pwsh
        run: Copy-Item target/release/blf_decoder.exe "blf_decoder-${{ github.ref_name }}-windows-x64.exe"
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: BLF Decoder ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            blf_decoder-${{ github.ref_name }}-windows-x64.exe

  linux:
    runs-on: ubuntu-latest
    needs: windows
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release
      - name: Rename artifact
        run: cp target/release/blf_decoder "blf_decoder-${{ github.ref_name }}-linux-x64"
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            blf_decoder-${{ github.ref_name }}-linux-x64
